[package]
name = "zhis"
version = "0.8.3"
edition = "2021"
description = "A shell history tool for zsh, written in Rust. Records every command with its working directory, exit status, and duration."
license = "MIT"

[dependencies]
# kill(pid, 0) to tell a live shell from one that died mid-command.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
