[package]
name = "zhis"
version = "0.1.0"
edition = "2021"
description = "A shell history tool for zsh, written in Rust. Records every command with its working directory, exit status, and duration."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
